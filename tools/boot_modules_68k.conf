# Q9-OS 68k boot/runtime defaults.
# This file is sourced by tools/mkbootfile.sh.

Q9_BOOT_MODULES="${Q9_BOOT_MODULES:-}"
if [ -n "${MWOS_ROOT:-}" ]; then
    Q9_BOOT_MODULES="$Q9_BOOT_MODULES ${MWOS_ROOT}/OS9/68000/CMDS/math"
    Q9_BOOT_MODULES="$Q9_BOOT_MODULES ${MWOS_ROOT}/OS9/68000/CMDS/csl"
    Q9_BOOT_MODULES="$Q9_BOOT_MODULES ${MWOS_ROOT}/OS9/68000/CMDS/mshell"
fi
export Q9_BOOT_MODULES
